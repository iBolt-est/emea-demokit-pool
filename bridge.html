<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>AMD Demokit — Board Info</title>
  <style>
    :root{--red:#ED1C24;--black:#000;--surface:#F2F2F2;--card:#fff;--text:#1A1A1A;--muted:#666;--border:#E4E4E4;--yb:#FFFBEA;--ybo:#F0B429;--green:#1B7A3E;--navy:#1A3A5C}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--surface);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
    .header{background:var(--black);padding:12px 18px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
    .header-logo img{display:block;height:28px;width:auto}
    .header-divider{width:1px;height:24px;background:#444;flex-shrink:0}
    .header-sub{color:#aaa;font-size:12px;line-height:1.35}
    .header-sub strong{display:block;color:#fff;font-size:13px}
    .main{max-width:460px;margin:0 auto;padding:18px 14px 40px}
    .board-card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.10);margin-bottom:14px}
    .card-banner{background:var(--red);padding:16px 20px 14px;color:#fff}
    .banner-label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;opacity:.82;font-weight:600}
    .banner-serial{font-size:24px;font-weight:700;letter-spacing:1.5px;margin-top:4px;font-family:'Courier New',monospace;word-break:break-all}
    .field-row{display:flex;padding:12px 20px;border-bottom:1px solid var(--border);align-items:flex-start;gap:10px;min-height:42px}
    .field-row:last-child{border-bottom:none}
    .field-label{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;min-width:88px;padding-top:2px;flex-shrink:0}
    .field-value{font-size:14px;color:var(--text);font-weight:500;flex:1;line-height:1.45}
    .field-value.mono{font-family:'Courier New',monospace;font-size:13px}
    .field-value.addr{font-size:13px;color:#444;font-style:italic;white-space:pre-line}
    .notice{background:var(--yb);border:1px solid var(--ybo);border-radius:10px;padding:12px 16px;font-size:13px;color:#5C4A00;line-height:1.55;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
    .notice-icon{font-size:18px;flex-shrink:0;margin-top:1px}
    .notice b{color:#3D3000}
    .link-card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.10);margin-bottom:14px}
    .link-card-title{padding:13px 20px 0;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
    .link-card-sub{padding:3px 20px 0;font-size:12px;color:#888}
    .link-url-box{padding:8px 20px 4px;font-size:11px;color:#444;font-family:'Courier New',monospace;word-break:break-all;line-height:1.55;user-select:all;-webkit-user-select:all}
    .copy-btn{display:block;width:calc(100% - 32px);margin:8px 16px 14px;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;color:#fff;transition:background .15s,transform .1s}
    .copy-btn:active{transform:scale(.98)}
    .copy-btn.public-btn{background:var(--red)}
    .copy-btn.owner-btn{background:var(--navy)}
    .copy-btn.ok{background:var(--green)!important}
    .error-card{background:var(--card);border-radius:14px;padding:36px 20px 28px;text-align:center;box-shadow:0 1px 6px rgba(0,0,0,.10);margin-bottom:14px}
    .error-icon{font-size:52px;margin-bottom:14px}
    .error-title{font-size:19px;font-weight:700;margin-bottom:8px}
    .error-body{font-size:14px;color:var(--muted);line-height:1.55}
    .error-sn{font-family:'Courier New',monospace;background:#F0F0F0;border-radius:7px;padding:8px 16px;font-size:14px;margin:14px auto;display:inline-block}
    .footer{text-align:center;font-size:11px;color:#aaa;margin-top:8px}
</style>
</head>

const OFFICE_ADDR = {"BeNeLux Office":"Villalaan 16, 9320 Erembodegem (Aalst), Belgium","Dublin Warehouse":"2020 Biaconi Avenue, CityWest Business Campus\nD24 T683, Saggart (Co Dublin), Ireland","Milano Office":"Via Riccardo Lombardi No 19/16\n20153 Milano, Italy","Munich Office":"Willy-Brandt-Allee 4, 81829 Munich, Germany","Sweden Office":"Knarrarnasgatan 15, 16440 Kista, Sweden","Paris Office":"Bât D, 2 Rue René Caudron\n78960 Voisins le Bretonneux, France"};
const PUBLIC_BASE = 'https://agreeable-island-0f60f9f0f.6.azurestaticapps.net/public/';
const OWNER_BASE  = 'https://agreeable-island-0f60f9f0f.6.azurestaticapps.net/owner/';

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function getParam(n) { return new URLSearchParams(location.search).get(n)||''; }
function publicLink(sn) { return PUBLIC_BASE+'?search='+encodeURIComponent(sn); }
function ownerLink(sn)  { return OWNER_BASE +'?search='+encodeURIComponent(sn); }

function fieldRow(label,value,cls) {
  if (!value) return '';
  return '<div class="field-row"><span class="field-label">'+esc(label)+'</span><span class="field-value'+(cls?' '+cls:'')+'">'+esc(value)+'</span></div>';
}

function linkBlock(serial) {
  var pub   = publicLink(serial);
  var own   = ownerLink(serial);
  return '<div class="notice"><span class="notice-icon">⚠️</span><div>The dashboard requires the <b>AMD internal network</b>. Copy a link below and open it on your AMD laptop or PC — it will jump directly to this board.</div></div>'+
    '<div class="link-card">'+
      '<div class="link-card-title">EMEA Sales Dashboard</div>'+
      '<div class="link-card-sub">Read-only — no login required</div>'+
      '<div class="link-url-box" id="url-public">'+esc(pub)+'</div>'+
      '<button class="copy-btn public-btn" id="btn-public" data-which="public" onclick="doCopy(this)">📋&nbsp; Copy Dashboard Link</button>'+
    '</div>'+
    '<div class="link-card">'+
      '<div class="link-card-title">Stock Owner Dashboard</div>'+
      '<div class="link-card-sub">Login required — AMD account</div>'+
      '<div class="link-url-box" id="url-owner">'+esc(own)+'</div>'+
      '<button class="copy-btn owner-btn" id="btn-owner" data-which="owner" onclick="doCopy(this)">📋&nbsp; Copy Stock Owner Link</button>'+
    '</div>';
}

function render() {
  var raw   = getParam('sn').trim();
  var board = raw ? LOOKUP[raw.toLowerCase()] : null;
  var el    = document.getElementById('main');

  if (!raw) {
    el.innerHTML = '<div class="error-card"><div class="error-icon">🔍</div><div class="error-title">No serial number</div><div class="error-body">This page opens via QR code on a Demokit board label.</div></div><div class="footer">AMD EMEA Demokit Pool · Internal Use Only</div>';
    return;
  }
  if (!board) {
    el.innerHTML = '<div class="error-card"><div class="error-icon">⚠️</div><div class="error-title">Board not registered</div><div class="error-sn">'+esc(raw)+'</div><div class="error-body">This serial is not yet in the pool database.<br>Contact your office stock owner to add it.</div></div>'+linkBlock(raw)+'<div class="footer">AMD EMEA Demokit Pool · Internal Use Only</div>';
    return;
  }

  var addr = OFFICE_ADDR[board.office] || '';
  el.innerHTML =
    '<div class="board-card">'+
      '<div class="card-banner"><div class="banner-label">Serial Number</div><div class="banner-serial">'+esc(board.serial)+'</div></div>'+
      fieldRow('Part Number',board.part,'mono')+
      fieldRow('Description',board.description)+
      fieldRow('Office',board.office)+
      fieldRow('Stock Owner',board.owner)+
      (board.revision?fieldRow('Revision',board.revision):'')+
      (addr?fieldRow('Ship To',addr,'addr'):'')+
    '</div>'+
    linkBlock(board.serial)+
    '<div class="footer">AMD EMEA Demokit Pool · Internal Use Only</div>';
}

function doCopy(btn) {
  var which = btn.dataset.which;
  var raw   = getParam('sn').trim();
  var board = raw ? LOOKUP[raw.toLowerCase()] : null;
  var sn    = (board && board.serial) ? board.serial : raw;
  var url   = (which === 'owner') ? ownerLink(sn) : publicLink(sn);
  var origHtml = btn.innerHTML;

  function resetBtn() {
    btn.classList.remove('ok');
    btn.innerHTML = origHtml;
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(function() {
      btn.textContent = '✓  Copied!';
      btn.classList.add('ok');
      setTimeout(resetBtn, 2800);
    }).catch(function() { fallbackCopy(btn, which, resetBtn); });
  } else {
    fallbackCopy(btn, which, resetBtn);
  }
}

function fallbackCopy(btn, which, resetBtn) {
  var elId = 'url-' + which;
  var el   = document.getElementById(elId);
  if (el) {
    var r = document.createRange();
    r.selectNodeContents(el);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
  }
  btn.textContent = '✓  Link selected — long-press to copy';
  btn.classList.add('ok');
  setTimeout(resetBtn, 3500);
}

render();
</script>
